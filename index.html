<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GTA 6 - 3D / 4D</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        #ui {
            position: absolute; z-index: 1; top: 15px; left: 15px;
            color: white; background: rgba(0,0,0,.65); padding: 12px 16px;
            border-radius: 8px; line-height: 1.7; pointer-events: none;
        }
        #dimension-alert {
            position: absolute; z-index: 1; top: 15px; right: 15px;
            color: #00ffff; font-size: 20px; font-weight: bold; display: none;
            text-shadow: 0 0 12px #00ffff;
        }
        #error-message {
            display: none; position: absolute; inset: 0; z-index: 2;
            align-items: center; justify-content: center; padding: 24px;
            color: white; background: #111; text-align: center; direction: rtl;
        }
    </style>
    <!-- Three.js rendering library -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <b>GTA 6 - גרסת 3D/4D</b><br>
        תנועה / נהיגה: <b>חצים</b><br>
        כניסה / יציאה מרכב: <b>E</b><br>
        כוח 4D (האטת זמן ושינוי מימד): <b>T</b>
    </div>
    <div id="dimension-alert">🌀 מימד 4D פעיל: זמן איטי!</div>
    <div id="error-message">לא ניתן לטעון את מנוע התלת־ממד. בדקו את החיבור לאינטרנט ונסו לרענן את המשחק.</div>

    <script>
        (() => {
            const errorMessage = document.getElementById("error-message");
            if (!window.THREE) {
                errorMessage.style.display = "flex";
                return;
            }

            const scene = new THREE.Scene();
            const skyColor = 0x87ceeb;
            const dimensionColor = 0x1a0033;
            scene.background = new THREE.Color(skyColor);
            scene.fog = new THREE.Fog(skyColor, 35, 180);

            const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.HemisphereLight(0xffffff, 0x53634b, 2));
            const sunlight = new THREE.DirectionalLight(0xffffff, 2.2);
            sunlight.position.set(50, 100, 50);
            scene.add(sunlight);

            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(400, 400),
                new THREE.MeshLambertMaterial({ color: 0x2e6e32 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.05;
            scene.add(ground);

            // Main road and crossing road, with visible lane markings.
            const roadMaterial = new THREE.MeshLambertMaterial({ color: 0x333333 });
            function addRoad(width, length, x, z, rotation = 0) {
                const road = new THREE.Mesh(new THREE.PlaneGeometry(width, length), roadMaterial);
                road.rotation.x = -Math.PI / 2;
                road.rotation.z = rotation;
                road.position.set(x, 0.02, z);
                scene.add(road);
            }
            addRoad(16, 400, 0, 0);
            addRoad(400, 16, 0, 0, Math.PI / 2);

            const lineMaterial = new THREE.MeshBasicMaterial({ color: 0xf2d35e });
            function addLaneLine(x1, z1, x2, z2) {
                const dx = x2 - x1;
                const dz = z2 - z1;
                const line = new THREE.Mesh(new THREE.PlaneGeometry(Math.hypot(dx, dz), 0.22), lineMaterial);
                line.rotation.x = -Math.PI / 2;
                line.position.set((x1 + x2) / 2, 0.04, (z1 + z2) / 2);
                line.rotation.z = -Math.atan2(dz, dx);
                scene.add(line);
            }
            for (let p = -195; p < 200; p += 12) {
                addLaneLine(p, 0, Math.min(p + 6, 200), 0);
                addLaneLine(0, p, 0, Math.min(p + 6, 200));
            }

            const buildings = [];
            const buildingMaterials = [0x777777, 0x686b72, 0x8a7968, 0x596a70].map(
                color => new THREE.MeshLambertMaterial({ color })
            );
            for (let x = -80; x <= 80; x += 35) {
                for (let z = -80; z <= 80; z += 35) {
                    // Keep the crossing roads and starting area clear.
                    if (Math.abs(x) < 15 || Math.abs(z) < 15 || (x > 10 && x < 30 && z > 0 && z < 30)) continue;
                    const width = 15;
                    const depth = 15;
                    const height = 10 + Math.random() * 25;
                    const building = new THREE.Mesh(
                        new THREE.BoxGeometry(width, height, depth),
                        buildingMaterials[Math.floor(Math.random() * buildingMaterials.length)]
                    );
                    building.position.set(x, height / 2, z);
                    scene.add(building);
                    buildings.push({ mesh: building, x, z, halfWidth: width / 2, halfDepth: depth / 2 });
                }
            }

            const player = new THREE.Mesh(
                new THREE.BoxGeometry(1, 2, 1),
                new THREE.MeshLambertMaterial({ color: 0x00ffcc })
            );
            player.position.set(3, 1, 3);
            scene.add(player);

            const carGroup = new THREE.Group();
            const carBody = new THREE.Mesh(
                new THREE.BoxGeometry(2.4, 1, 4.5),
                new THREE.MeshLambertMaterial({ color: 0xff2222 })
            );
            carBody.position.y = 0.7;
            carGroup.add(carBody);
            const cabin = new THREE.Mesh(
                new THREE.BoxGeometry(2, 0.8, 2.2),
                new THREE.MeshLambertMaterial({ color: 0x202c32 })
            );
            cabin.position.set(0, 1.5, -0.3);
            carGroup.add(cabin);
            carGroup.position.set(0, 0, 0);
            scene.add(carGroup);

            let inCar = false;
            let carSpeed = 0;
            let is4DMode = false;
            let timeScale = 1;
            const keys = Object.create(null);
            const clock = new THREE.Clock();
            const cameraOffset = new THREE.Vector3();
            const desiredCameraPosition = new THREE.Vector3();

            window.addEventListener("keydown", (event) => {
                if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.code)) event.preventDefault();
                keys[event.code] = true;
                if (event.repeat) return;
                if (event.code === "KeyE") toggleCar();
                if (event.code === "KeyT") toggle4D();
            });
            window.addEventListener("keyup", (event) => { keys[event.code] = false; });
            window.addEventListener("blur", () => {
                for (const key in keys) keys[key] = false;
            });

            function toggleCar() {
                if (!inCar) {
                    if (player.position.distanceTo(carGroup.position) < 5) {
                        inCar = true;
                        player.visible = false;
                    }
                } else {
                    inCar = false;
                    player.visible = true;
                    const exitOffset = new THREE.Vector3(2.5, 0, 0).applyAxisAngle(
                        new THREE.Vector3(0, 1, 0), carGroup.rotation.y
                    );
                    player.position.set(
                        carGroup.position.x + exitOffset.x,
                        1,
                        carGroup.position.z + exitOffset.z
                    );
                    carSpeed = 0;
                }
            }

            function toggle4D() {
                is4DMode = !is4DMode;
                timeScale = is4DMode ? 0.35 : 1;
                const color = is4DMode ? dimensionColor : skyColor;
                scene.background.setHex(color);
                scene.fog.color.setHex(color);
                document.getElementById("dimension-alert").style.display = is4DMode ? "block" : "none";
            }

            function isBlocked(x, z, radius = 0.8) {
                return buildings.some(({ x: bx, z: bz, halfWidth, halfDepth }) =>
                    Math.abs(x - bx) < halfWidth + radius && Math.abs(z - bz) < halfDepth + radius
                );
            }

            function movePlayer(dx, dz) {
                const nextX = THREE.MathUtils.clamp(player.position.x + dx, -195, 195);
                const nextZ = THREE.MathUtils.clamp(player.position.z + dz, -195, 195);
                if (!isBlocked(nextX, player.position.z)) player.position.x = nextX;
                if (!isBlocked(player.position.x, nextZ)) player.position.z = nextZ;
                if (dx || dz) player.rotation.y = Math.atan2(dx, dz);
            }

            function animate() {
                requestAnimationFrame(animate);
                const delta = Math.min(clock.getDelta(), 0.05);
                const frameScale = delta * 60 * timeScale;

                if (!inCar) {
                    let dx = 0;
                    let dz = 0;
                    if (keys.ArrowUp) dz -= 0.2 * frameScale;
                    if (keys.ArrowDown) dz += 0.2 * frameScale;
                    if (keys.ArrowLeft) dx -= 0.2 * frameScale;
                    if (keys.ArrowRight) dx += 0.2 * frameScale;
                    const length = Math.hypot(dx, dz);
                    if (length > 0) movePlayer(dx / length * 0.2 * frameScale, dz / length * 0.2 * frameScale);

                    desiredCameraPosition.set(player.position.x, player.position.y + 6, player.position.z + 10);
                    camera.position.lerp(desiredCameraPosition, 0.1);
                    camera.lookAt(player.position);
                } else {
                    if (keys.ArrowUp) carSpeed = Math.min(carSpeed + 0.02 * frameScale, 0.8);
                    else if (keys.ArrowDown) carSpeed = Math.max(carSpeed - 0.02 * frameScale, -0.4);
                    else carSpeed *= Math.pow(0.96, frameScale);

                    if (Math.abs(carSpeed) > 0.01) {
                        if (keys.ArrowLeft) carGroup.rotation.y += 0.04 * frameScale * Math.sign(carSpeed);
                        if (keys.ArrowRight) carGroup.rotation.y -= 0.04 * frameScale * Math.sign(carSpeed);
                    }

                    const nextX = carGroup.position.x - Math.sin(carGroup.rotation.y) * carSpeed * frameScale;
                    const nextZ = carGroup.position.z - Math.cos(carGroup.rotation.y) * carSpeed * frameScale;
                    if (Math.abs(nextX) < 195 && Math.abs(nextZ) < 195 && !isBlocked(nextX, nextZ, 1.5)) {
                        carGroup.position.x = nextX;
                        carGroup.position.z = nextZ;
                    } else {
                        carSpeed *= -0.35;
                    }

                    cameraOffset.set(0, 5, 11).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
                    desiredCameraPosition.copy(carGroup.position).add(cameraOffset);
                    camera.position.lerp(desiredCameraPosition, 0.15);
                    camera.lookAt(carGroup.position);
                }

                renderer.render(scene, camera);
            }

            window.addEventListener("resize", () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        })();
    </script>
</body>
</html>
